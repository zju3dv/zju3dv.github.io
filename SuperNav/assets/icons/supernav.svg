<svg xmlns="http://www.w3.org/2000/svg">
<!-- SuperNav line icons: 32-unit grid. Stroke width, caps and colour come from
     the host `.ui-icon`. Each icon carries one accent detail — the "waypoint" —
     painted with the CSS custom property "ica" and falling back to currentColor. -->

<!-- Brand: one continuous S route, with a start dot and tangent arrow tip.
     Geometry is shared with supernav-mark.svg and ../favicon.svg. -->
<symbol id="brand" viewBox="0 0 32 32">
  <path d="M8 24C11.5 27.5 24 28 24 21C24 14 8 18 8 11C8 5 15 5 23 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M21.7 2.8 27.2 8.05 19.7 10.6 21.5 6.63Z" style="fill:currentColor;stroke:none"/>
  <circle cx="8" cy="24" r="2.4" style="fill:var(--ica,currentColor);stroke:none"/>
</symbol>

<!-- Resources -->
<symbol id="paper" viewBox="0 0 32 32"><path d="M9 4.5h10l5.5 5.5v16A1.5 1.5 0 0 1 23 27.5H9A1.5 1.5 0 0 1 7.5 26V6A1.5 1.5 0 0 1 9 4.5Z"/><path d="M19 4.5V10h5.5M11.5 15.5h9M11.5 19.5h9M11.5 23.5h5"/><circle cx="12" cy="10" r="1.5" style="fill:var(--ica,currentColor);stroke:none"/></symbol>
<symbol id="code" viewBox="0 0 32 32"><path d="m11 10-6 6 6 6M21 10l6 6-6 6"/><path d="m18 7-4 18" style="stroke:var(--ica,currentColor)"/></symbol>
<symbol id="film" viewBox="0 0 32 32"><rect x="3.5" y="6.5" width="25" height="19" rx="4.5"/><path d="M13.5 12v8a.8.8 0 0 0 1.2.7l6.6-4a.8.8 0 0 0 0-1.4l-6.6-4a.8.8 0 0 0-1.2.7Z" style="fill:var(--ica,currentColor);stroke:none"/></symbol>
<symbol id="braces" viewBox="0 0 32 32"><path d="M11.5 5.5c-2.8 0-3.8 1.2-3.8 3.8v3c0 2.2-1 3.7-3.2 3.7 2.2 0 3.2 1.5 3.2 3.7v3c0 2.6 1 3.8 3.8 3.8M20.5 5.5c2.8 0 3.8 1.2 3.8 3.8v3c0 2.2 1 3.7 3.2 3.7-2.2 0-3.2 1.5-3.2 3.7v3c0 2.6-1 3.8-3.8 3.8"/><circle cx="16" cy="16" r="1.9" style="fill:var(--ica,currentColor);stroke:none"/></symbol>
<symbol id="campus" viewBox="0 0 32 32"><path d="M4 12 16 5l12 7M5.5 12h21M8.5 15v8M13.5 15v8M18.5 15v8M23.5 15v8M6 23.5h20M4 27.5h24"/><circle cx="16" cy="9.2" r="1.4" style="fill:var(--ica,currentColor);stroke:none"/></symbol>

<!-- Agent loop -->
<symbol id="eye" viewBox="0 0 32 32"><path d="M3 16s4.5-8.5 13-8.5S29 16 29 16s-4.5 8.5-13 8.5S3 16 3 16Z"/><circle cx="16" cy="16" r="4.2"/><circle cx="16" cy="16" r="1.6" style="fill:var(--ica,currentColor);stroke:none"/></symbol>
<symbol id="agent" viewBox="0 0 32 32"><rect x="6" y="9.5" width="20" height="16" rx="6"/><path d="M16 9.5V6.5M3.5 15.5v4M28.5 15.5v4M13 21h6"/><circle cx="12.2" cy="16" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="19.8" cy="16" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="16" cy="4.6" r="1.8" style="fill:var(--ica,currentColor);stroke:none"/></symbol>
<symbol id="route" viewBox="0 0 32 32"><circle cx="7.5" cy="24.5" r="3"/><path d="M10.5 24.5h8a4 4 0 0 0 0-8h-5a4 4 0 0 1 0-8H21"/><circle cx="24.5" cy="8.5" r="2.4" style="fill:var(--ica,currentColor);stroke:none"/></symbol>
