<symbol id="gallery" viewBox="0 0 32 32"><rect x="4" y="5.5" width="24" height="21" rx="2.5"/><path d="m7.5 22.5 6-6.5 4 4 3-3 4 5.5"/><circle cx="11" cy="11.5" r="2" style="fill:var(--ica,currentColor);stroke:none"/></symbol>
<symbol id="showroom" viewBox="0 0 32 32"><path d="M5.5 13v14.5h21V13M3.5 12.5 6.5 5h19l3 7.5ZM4 27.5h24"/><path d="M12.5 27.5v-8h7v8" style="stroke:var(--ica,currentColor)"/></symbol>
<symbol id="work-area" viewBox="0 0 32 32"><rect x="7.5" y="4" width="17" height="12" rx="2"/><path d="M16 16v4M12 20h8M3.5 23.5h25M6 23.5v5M26 23.5v5"/><circle cx="16" cy="10" r="1.7" style="fill:var(--ica,currentColor);stroke:none"/></symbol>
<symbol id="decorating" viewBox="0 0 32 32"><path d="M11 15.5h10c-1.5 3 2 5.5 1 9-.6 2.2-2.4 3.5-6 3.5s-5.4-1.3-6-3.5c-1-3.5 2.5-6 1-9Z"/><path d="M16 15.5V8"/><path d="M16 10.5c-5 0-7-3-7-6.5 4 0 7 2 7 6.5ZM16 12.5c4.5 0 6.5-3 6.5-6.5-4 0-6.5 2.5-6.5 6.5Z" style="stroke:var(--ica,currentColor)"/></symbol>
<symbol id="bathroom" viewBox="0 0 32 32"><path d="M3.5 16.5h25v2a7 7 0 0 1-7 7h-11a7 7 0 0 1-7-7Z"/><path d="M9 25.5 7.5 28.5M23 25.5l1.5 3M7.5 16.5V8a3.5 3.5 0 0 1 7 0"/><path d="M11.5 10.5h6" style="stroke:var(--ica,currentColor)"/></symbol>




<!-- Interface -->
<symbol id="pause" viewBox="0 0 32 32"><path d="M11.5 8v16M20.5 8v16" stroke-width="2.6"/></symbol>
<symbol id="play" viewBox="0 0 32 32"><path d="M10 7.2v17.6a1 1 0 0 0 1.5.9l14.2-8.8a1 1 0 0 0 0-1.8L11.5 6.3a1 1 0 0 0-1.5.9Z"/></symbol>
<symbol id="arrow" viewBox="0 0 32 32"><path d="M8.5 23.5 23.5 8.5M11 8.5h12.5V21"/></symbol>
<symbol id="arrow-right" viewBox="0 0 32 32"><path d="M5 16h21M18 8l8 8-8 8"/></symbol>
<symbol id="arrow-up" viewBox="0 0 32 32"><path d="M16 26V6M8 14l8-8 8 8"/></symbol>
<symbol id="expand" viewBox="0 0 32 32"><path d="M19 5h8v8M13 27H5v-8M27 5l-8.5 8.5M5 27l8.5-8.5"/></symbol>
<symbol id="close" viewBox="0 0 32 32"><path d="m8.5 8.5 15 15m0-15-15 15"/></symbol>
