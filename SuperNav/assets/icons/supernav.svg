<symbol id="robot" viewBox="0 0 32 32"><rect x="6.5" y="11" width="15.5" height="6.5" rx="2.2"/><path d="M22 12.5h4.3a1.7 1.7 0 0 1 1.7 1.7v1.6a1.7 1.7 0 0 1-1.7 1.7H22M10 17.5l2.5 4.5-2.5 4.5M18.5 17.5l2.5 4.5-2.5 4.5M11 11V8h4"/><circle cx="25.4" cy="15" r="1.2" style="fill:var(--ica,currentColor);stroke:none"/></symbol>

